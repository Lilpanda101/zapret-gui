<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#313244" stroke-width="2"/>

  <!-- Outer Shield Outline -->
  <path d="M64 24 C84 24 100 32 100 48 C100 78 64 102 64 102 C64 102 28 78 28 48 C28 32 44 24 64 24 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Inner Shield Fill -->
  <path d="M64 28 C80 28 94 35 94 49 C94 74 64 94 64 94 C64 94 34 74 34 49 C34 35 48 28 64 28 Z" 
        fill="url(#shieldGrad)" opacity="0.15"/>

  <!-- Lightning Bolt (Bypass Power) -->
  <path d="M68 38 L48 66 L62 66 L58 90 L80 60 L66 60 Z" 
        fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
